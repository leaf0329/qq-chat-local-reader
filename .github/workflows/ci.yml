name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      QCLR_NATIVE_BUILD_INPUTS: C:\qclr-native
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache pinned native build inputs
        uses: actions/cache@v4
        with:
          path: C:\qclr-native
          key: sqlcipher-win-x64-c7e811b3-vcpkg-701d832d

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Test and compile distributions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          try {
            ./scripts/build-release.ps1 -Version 0.1.0-ci -InnoCompilerPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' *>&1 | Tee-Object -FilePath artifacts/ci-build.log
          }
          catch {
            $detail = ((Get-Content -LiteralPath artifacts/ci-build.log -Tail 12) + $_.Exception.Message) -join "`n"
            $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Distribution build failed::$escaped"
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Distribution build failed`n``````text`n$detail`n``````"
            }
            throw
          }

      - name: Verify expected artifacts
        shell: powershell
        run: |
          $expected = @(
            'artifacts/0.1.0-ci/qq-chat-local-reader-0.1.0-ci-win-x64-portable.zip',
            'artifacts/0.1.0-ci/qq-chat-local-reader-0.1.0-ci-win-x64-setup.exe',
            'artifacts/0.1.0-ci/SHA256SUMS.txt'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing artifact: $path" }
          }
